name: Build llama.cpp UD-Q3_K_XL + DFlash2

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 版本号（如 v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
      actions: write
    steps:
      - name: Install CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Checkout ggml-org/llama.cpp PR #27342 HEAD (no commit pin)
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: refs/pull/27342/head
          fetch-depth: 0
          submodules: recursive
          path: src

      - name: Show PR HEAD commit
        shell: cmd
        run: |
          cd src
          git log -1 --oneline

      - name: Build llama-server (Windows + CUDA 12.8 + sm_120)
        shell: cmd
        run: |
          echo ================================================================
          echo [1/6] Loading MSVC x64
          echo ================================================================
          for /f "delims=" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set "VS_PATH=%%i"
          set "VCVARS=%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist "%VCVARS%" (echo FAILED %VCVARS% && exit /b 1)
          call "%VCVARS%"
          if %ERRORLEVEL% neq 0 (echo MSVC init failed && exit /b 1)
          where cl.exe || (echo cl.exe not found && exit /b 1)
          for /f "delims=" %%i in ('where cl.exe') do set "CL_PATH=%%i"
          echo MSVC cl.exe: %CL_PATH%

          echo ================================================================
          echo [2/6] Remove MinGW from PATH
          echo ================================================================
          set "PATH=%PATH:C:\mingw64\bin;=%"
          set "PATH=%PATH:;C:\mingw64\bin=%"
          set "PATH=%PATH:C:\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\mingw64\bin;=%"
          set "PATH=%PATH:;C:\msys64\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\ucrt64\bin;=%"
          set "PATH=%PATH:;C:\msys64\ucrt64\bin=%"
          set "PATH=%PATH:C:\msys64\ucrt64\bin=%"
          where cc.exe && (
            for %%i in (cc.exe gcc.exe g++.exe) do (
              for /f "delims=" %%j in ('where %%i 2^>nul') do del /f /q "%%j" || echo del %%j failed
            )
          ) || echo cc.exe already gone
          where cc.exe && (echo cc.exe still exists && exit /b 1) || echo MinGW removed OK

          echo ================================================================
          echo [3/6] Install deps and verify CUDA
          echo ================================================================
          echo CUDA_PATH: %CUDA_PATH%
          set "CUDA_BIN=%CUDA_PATH%\bin"
          if not exist "%CUDA_BIN%\nvcc.exe" (
            echo nvcc.exe not found in %CUDA_BIN%
            dir "%CUDA_BIN%"
            exit /b 1
          )
          echo CUDA bin: %CUDA_BIN%
          set "PATH=%CUDA_BIN%;%PATH%"
          choco install openssl ninja -y --no-progress
          where ninja || (echo ninja not found && exit /b 1)
          where nvcc || (echo nvcc not found && exit /b 1)
          nvcc --version

          echo ================================================================
          echo [4/6] CMake configure (PR #27342 HEAD, sm_120)
          echo ================================================================
          cd src
          if exist build rmdir /s /q build
          mkdir build
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DCMAKE_C_COMPILER="%CL_PATH%" ^
            -DCMAKE_CXX_COMPILER="%CL_PATH%" ^
            -DCMAKE_CUDA_COMPILER="%CUDA_BIN%\nvcc.exe" ^
            -DCMAKE_C_COMPILER_WORKS=ON ^
            -DCMAKE_CXX_COMPILER_WORKS=ON ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="120" ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_BORINGSSL=OFF ^
            -DOPENSSL_USE_STATIC_LIBS=ON ^
            -DOPENSSL_ROOT_DIR="C:\Program Files\OpenSSL" ^
            -DCMAKE_C_FLAGS="/MT" ^
            -DCMAKE_CXX_FLAGS="/MT" ^
            -DCMAKE_VERBOSE_MAKEFILE=ON
          if %ERRORLEVEL% neq 0 (echo CMake failed && exit /b 1)

          echo ================================================================
          echo [5/6] Build llama-server
          echo ================================================================
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% -t llama-server
          if %ERRORLEVEL% neq 0 (echo Build failed && exit /b 1)
          echo BUILD SUCCESS

          echo ================================================================
          echo [6/6] Collect artifacts
          echo ================================================================
          mkdir out
          copy build\bin\Release\llama-server.exe out\
          copy build\bin\Release\*.dll out\
          copy "%CUDA_PATH%\bin\cudart64_*.dll" out\
          copy "%CUDA_PATH%\bin\cublas64_*.dll" out\
          copy "%CUDA_PATH%\bin\cublasLt64_*.dll" out\
          copy "C:\Windows\System32\vcruntime140.dll" out\
          copy "C:\Windows\System32\vcruntime140_1.dll" out\
          copy "C:\Windows\System32\msvcp140.dll" out\
          copy "C:\Windows\System32\msvcp140_1.dll" out\
          copy "C:\Windows\System32\msvcp140_2.dll" out\
          copy "C:\Windows\System32\concrt140.dll" out\
          dir out\

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-dflash2-rtx5060ti
          path: src/out/
          retention-days: 7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: llama-server-dflash2-rtx5060ti
          path: release-files

      - name: Generate helper scripts (start.bat + check_ud_dflash.bat)
        shell: pwsh
        run: |
          $checkBat = '@echo off
          chcp 65001 >nul 2>&1
          echo ============================================================
          echo  UD-Q3_K_XL + DFlash2 compatibility check
          echo ============================================================
          echo  Checks whether blk.64.nextn.* (MTP anchor for DFlash2)
          echo  is silently ignored when loading UD dynamic quant.
          echo  If ignored, DFlash2 acceptance collapses to ~0.
          echo.
          set "EXE=llama-server.exe"
          if not exist "%EXE%" (echo ERROR: %EXE% not found in this folder & pause & exit /b 1)
          if not exist "Qwen3.8-27B-UD-Q3_K_XL.gguf" (echo WARNING: UD model not found, skipping UD test & goto :q4)
          if not exist "Qwen3.8-27B-DFlash2-Q4_K_M.gguf" (echo WARNING: Draft model not found & goto :q4)
          echo --- Test A: UD-Q3_K_XL + DFlash2 (ngl 99) ---
          %EXE% -m Qwen3.8-27B-UD-Q3_K_XL.gguf -md Qwen3.8-27B-DFlash2-Q4_K_M.gguf --spec-type draft-dflash --spec-draft-n-max 4 -ngl 99 -ngld 99 -c 1024 -t 4 --host 127.0.0.1 --port 18080 2>&1 | findstr /n "nextn ignoring draft-dflash n_max listening"
          echo.
          echo RESULT: If "blk.64.nextn.* ignoring" appears above, UD+DFlash2 is NOT supported by this build.
          echo   Workaround 1: UD-Q3_K_XL pure (no -md) for ~28 tok/s
          echo   Workaround 2: Q4_K_M + DFlash2 for ~4.4 tok/s (start.bat option 2)
          echo   If NO ignore line AND "draft-dflash: n_max=4" shown, send a chat msg and check "draft acceptance" (useful if ~0.4+).
          echo.
          :q4
          echo --- Test B: Q4_K_M + DFlash2 (known working baseline) ---
          if exist "Qwen3.8-27B-Q4_K_M.gguf" (
            %EXE% -m Qwen3.8-27B-Q4_K_M.gguf -md Qwen3.8-27B-DFlash2-Q4_K_M.gguf --spec-type draft-dflash --spec-draft-n-max 4 -ngl 40 -ngld 99 -c 1536 -t 4 --host 127.0.0.1 --port 18081 2>&1 | findstr /n "nextn ignoring draft-dflash n_max listening"
          ) else (
            echo Q4_K_M.gguf not found, skipping reference test.
          )
          pause
          '
          Set-Content -Path "release-files\check_ud_dflash.bat" -Value $checkBat -Encoding ASCII

          $startBat = '@echo off
          chcp 65001 >nul 2>&1
          title Qwen3.8-27B Launcher
          echo 1) UD-Q3_K_XL PURE (ngl 99, c8192) ~28 tok/s, no DFlash2
          echo 2) Q4_K_M + DFlash2 (ngl 40, c1536) ~4.4 tok/s [verified]
          echo 3) Q4_K_M + DFlash2 (ngl 35, c16384) ~3.6 tok/s long ctx
          echo Q) Quit
          set /p c=Choose [1/2/3/Q]:
          if /i "%c%"=="1" goto u
          if /i "%c%"=="2" goto q
          if /i "%c%"=="3" goto l
          goto :eof
          :u
          llama-server.exe -m Qwen3.8-27B-UD-Q3_K_XL.gguf -ngl 99 -c 8192 -ctk q8_0 -ctv q8_0 -t 4 --host 0.0.0.0 --port 8080
          goto :eof
          :q
          llama-server.exe -m Qwen3.8-27B-Q4_K_M.gguf -md Qwen3.8-27B-DFlash2-Q4_K_M.gguf --spec-type draft-dflash --spec-draft-n-max 4 -ngl 40 -ngld 99 -c 1536 -t 4 --host 0.0.0.0 --port 8080
          goto :eof
          :l
          llama-server.exe -m Qwen3.8-27B-Q4_K_M.gguf -md Qwen3.8-27B-DFlash2-Q4_K_M.gguf --spec-type draft-dflash --spec-draft-n-max 4 -ngl 35 -ngld 99 -c 16384 -ctk q4_0 -ctv q4_0 -t 4 --host 0.0.0.0 --port 8080
          goto :eof
          '
          Set-Content -Path "release-files\start.bat" -Value $startBat -Encoding ASCII
          echo Helper scripts written.

      - name: Package release zip
        shell: pwsh
        run: |
          $zipName = "llama-server-dflash2-rtx5060ti-cuda12.8-${{ inputs.tag_name }}.zip"
          Compress-Archive -Path "release-files\*" -DestinationPath $zipName -Force
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: llama.cpp DFlash2 ${{ inputs.tag_name }} RTX 5060 Ti
          body: |
            llama.cpp DFlash2 build for RTX 5060 Ti (Blackwell sm_120, CUDA 12.8)

            Base: ggml-org/llama.cpp PR #27342 HEAD (no commit pin; built against latest PR HEAD at release time)

            Features:
            - DFlash2 speculative decoding via --spec-type draft-dflash
            - CUDA 12.8 + sm_120 native, all DLLs included
            - Includes start.bat (3 presets) and check_ud_dflash.bat

            Models needed (place next to exe):
            - Qwen3.8-27B-Q4_K_M.gguf  (ggml-org/Qwen3.8-27B-GGUF) [recommended for DFlash2]
            - Qwen3.8-27B-UD-Q3_K_XL.gguf (unsloth/Qwen3.8-27B-GGUF) [target for UD+DFlash2 test]
            - Qwen3.8-27B-DFlash2-Q4_K_M.gguf (incoai/Qwen3.8-27B-DFlash2-GGUF)

            Compatibility note:
            Run check_ud_dflash.bat after extracting. If startup logs show "blk.64.nextn.* ignoring", this PR HEAD build does not support UD-Q3_K_XL + DFlash2 (MTP anchor dropped); use UD-Q3_K_XL pure (~28 tok/s) or Q4_K_M + DFlash2 (~4.4 tok/s). If no ignore line appears and "draft-dflash: n_max=4" is shown, send a message and check "draft acceptance" in the timing log (useful if ~0.4+).
          files: |
            ${{ env.ZIP_PATH }}
            release-files/llama-server.exe
            release-files/*.dll
            release-files/check_ud_dflash.bat
            release-files/start.bat
