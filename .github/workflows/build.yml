name: Build llama.cpp DFlash2 for RTX 5060 Ti

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # 1a. 检出 PR #27342 head
      - name: Checkout llama.cpp PR #27342
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: refs/pull/27342/head
          submodules: recursive
          path: src

      # 1b. 切到社区验证通过的 commit 5ecbe1ac1
        shell: cmd
        run: |
          cd src
          git fetch origin 5ecbe1ac1
          git checkout 5ecbe1ac1

      # 2. 安装 CUDA 12.8.0
      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.23
        id: cuda-toolkit
        with:
          cuda: "12.8.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      # 3. 验证 CUDA 安装
      - name: Verify CUDA
        shell: cmd
        run: |
          set "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          echo CUDA_PATH: %CUDA_PATH%
          dir "%CUDA_PATH%\bin\nvcc.exe"
          "%CUDA_PATH%\bin\nvcc.exe" --version

      # 4. 配置 CMake
      - name: Configure CMake
        shell: cmd
        run: |
          FOR /F "usebackq tokens=*" %%i IN (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) DO SET "VS_PATH=%%i"
          SET "MSVC_PATH=%VS_PATH%\VC\Tools\MSVC"
          FOR /F "tokens=*" %%i IN ('DIR /B /AD /O-N "%MSVC_PATH%"') DO SET "MSVC_VERSION=%%i"
          SET "CL_EXE=%MSVC_PATH%\%MSVC_VERSION%\bin\Hostx64\x64\cl.exe"

          ECHO Using C compiler: %CL_EXE%

          cmake -S src -B build ^
            -G Ninja ^
            -DCMAKE_C_COMPILER="%CL_EXE%" ^
            -DCMAKE_CXX_COMPILER="%CL_EXE%" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_ARCHITECTURES="120" ^
            -DCMAKE_CUDA_COMPILER="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin\nvcc.exe" ^
            -DCMAKE_CUDA_ARCHITECTURES="120" ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA_F16=ON ^
            -DGGML_CUDA_PEER_MAX_BATCH_SIZE=128 ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      # 5. 编译
      - name: Build
        shell: cmd
        run: |
          set "PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC;%PATH%"
          set "PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE;%PATH%"
          set "PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools;%PATH%"
          set "PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin;%PATH%"
          set "PATH=C:\Windows\System32;%PATH%"
          set "PATH=C:\Windows\SysWOW64;%PATH%"
          set "PATH=C:\Program Files\PowerShell\7;%PATH%"

          cmake --build build --config Release --parallel

      # 6. 收集产物
      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir dist
          copy build\bin\llama-server.exe dist\
          copy build\bin\llama-common.dll dist\
          copy build\bin\llama-server-impl.dll dist\
          copy build\bin\llama.dll dist\
          copy build\bin\ggml.dll dist\
          copy build\bin\ggml-base.dll dist\
          copy build\bin\ggml-cpu.dll dist\
          copy build\bin\ggml-cuda.dll dist\
          copy build\bin\mtmd.dll dist\

          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin\cudart64_12.dll" dist\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin\cublas64_12.dll" dist\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin\cublasLt64_12.dll" dist\

          FOR /F "usebackq tokens=*" %%i IN (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) DO SET "VS_PATH=%%i"
          SET "MSVC_PATH=%VS_PATH%\VC\Tools\MSVC"
          FOR /F "tokens=*" %%i IN ('DIR /B /AD /O-N "%MSVC_PATH%"') DO SET "MSVC_VERSION=%%i"
          copy "%MSVC_PATH%\%MSVC_VERSION%\bin\Hostx64\x64\msvcp140.dll" dist\
          copy "%MSVC_PATH%\%MSVC_VERSION%\bin\Hostx64\x64\vcruntime140.dll" dist\
          copy "%MSVC_PATH%\%MSVC_VERSION%\bin\Hostx64\x64\vcruntime140_1.dll" dist\
          copy "%MSVC_PATH%\%MSVC_VERSION%\bin\Hostx64\x64\msvcp140_1.dll" dist\
          copy "%MSVC_PATH%\%MSVC_VERSION%\bin\Hostx64\x64\msvcp140_2.dll" dist\
          copy "%MSVC_PATH%\%MSVC_VERSION%\bin\Hostx64\x64\concrt140.dll" dist\

      # 7. 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-dflash2
          path: dist\*

      # 8. 发布 Release
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dflash2-${{ github.run_number }}
          name: llama-server DFlash2 (commit 5ecbe1ac1)
          body: |
            llama-server.exe built from ggml-org/llama.cpp PR #27342 (commit 5ecbe1ac1)
            - CUDA 12.8.0, sm_120 (RTX 5060 Ti / Blackwell)
            - DFlash2 speculative decoding for Qwen3.8-27B
            - Static /MT linking, Windows x64
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
