name: Build llama.cpp DFlash2 for RTX 5060 Ti

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout llama.cpp PR #27342
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          fetch-depth: 0

      - name: Switch to DFlash2 PR branch
        shell: bash
        run: |
          git fetch origin pull/27342/head:pr-27342
          git switch pr-27342

      - name: Install CUDA 12.4
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=120 ^
            -DBUILD_SHARED_LIBS=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE/out
          Get-ChildItem -Path $env:GITHUB_WORKSPACE/build -Recurse -Include *.exe,*.dll |
            Copy-Item -Destination $env:GITHUB_WORKSPACE/out -Force
          Compress-Archive -Path $env:GITHUB_WORKSPACE/out/* -DestinationPath $env:GITHUB_WORKSPACE/llama-dflash2.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-dflash2-win64-cuda12-rtx5060ti
          path: llama-dflash2.zip
