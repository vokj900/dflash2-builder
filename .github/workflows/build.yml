name: Build llama.cpp DFlash2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022    # ← 换 2022，配 CUDA 12.8.1
    steps:
      - name: Checkout llama.cpp PR #27342
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          fetch-depth: 0

      - name: Switch to DFlash2 PR branch
        run: |
          git fetch origin pull/27342/head:pr-27342
          git switch pr-27342

      - name: Install CUDA 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: '12.8.1'     # ← 12.8.1 存在，12.8.0 不存在
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CUDA=ON ^
            -DBUILD_SHARED_LIBS=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Pack
        run: Compress-Archive -Path $env:GITHUB_WORKSPACE/build/Release/* -DestinationPath $env:GITHUB_WORKSPACE/llama-dflash2.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          path: llama-dflash2.zip
          name: llama-dflash2-win64-cuda12.zip
