name: Build llama.cpp DFlash2 for RTX 5060 Ti

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 版本号（如 v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string
      cuda_version:
        description: 'CUDA 版本（如 12.8.1）'
        required: false
        default: '12.8.1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      actions: write
      contents: write

    steps:
      # 0. 安装 CUDA Toolkit
      - name: Install CUDA Toolkit ${{ inputs.cuda_version }}
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ inputs.cuda_version }}
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      # 1. 拉取 aetherbird/llama.cpp（bailingmoe3-support 分支，含 MTP/DFlash2 改动）
      - name: Checkout aetherbird/llama.cpp (bailingmoe3-support)
        uses: actions/checkout@v4
        with:
          repository: aetherbird/llama.cpp
          ref: bailingmoe3-support
          submodules: recursive
          path: src

      # 2. 编译
      - name: Build llama-server (Windows + CUDA 12.8 + sm_120 + DFlash2/MTP)
        shell: cmd
        run: |
          echo ================================================================
          echo [1/6] 加载 MSVC x64 环境
          echo ================================================================
          for /f "delims=" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set "VS_PATH=%%i"
          set "VCVARS=%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist "%VCVARS%" (echo ❌ 未找到 %VCVARS% && exit /b 1)
          call "%VCVARS%"
          if %ERRORLEVEL% neq 0 (echo ❌ MSVC 环境加载失败 && exit /b 1)
          where cl.exe || (echo ❌ cl.exe 未加载 && exit /b 1)
          for /f "delims=" %%i in ('where cl.exe') do set "CL_PATH=%%i"
          echo ✅ MSVC cl.exe: %CL_PATH%

          echo ================================================================
          echo [2/6] 从 PATH 中剔除预装 MinGW
          echo ================================================================
          set "PATH=%PATH:C:\mingw64\bin;=%"
          set "PATH=%PATH:;C:\mingw64\bin=%"
          set "PATH=%PATH:C:\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\mingw64\bin;=%"
          set "PATH=%PATH:;C:\msys64\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\ucrt64\bin;=%"
          set "PATH=%PATH:;C:\msys64\ucrt64\bin=%"
